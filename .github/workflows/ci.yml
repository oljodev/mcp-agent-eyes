name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `pretest` compiles with tsc, so this type-checks and unit-tests in one go.
      # The suite is pure logic (config, Chrome detection, vault crypto, asserts) —
      # it never launches a browser, so CI needs no display and no Chrome.
      - run: npm test
